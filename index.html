<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haris Fantasy Cricket</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#087f5b;padding:22px;text-align:center}
main{padding:16px;max-width:600px;margin:auto}
.card{background:#1e293b;padding:14px;border-radius:12px;margin:12px 0}
button,select{padding:10px;border:0;border-radius:7px;margin:4px}
button{background:#12b886;color:white;font-weight:bold}
.player{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid #39465b;padding:10px 0}
.small{color:#cbd5e1;font-size:13px}
</style>
</head>
<body>
<header>
<h2>🏏 Haris Fantasy Cricket</h2>
<p>Build Your Dream XI</p>
</header>
<main>
<div class="card">
<h3>South Africa 🇿🇦 vs Australia 🇦🇺</h3>
<p class="small">DEMO MATCH — sample players, not live squads</p>
<p>Selected: <b id="count">0</b>/11</p>
</div>
<div class="card">
<h3>Select Your Players</h3>
<div id="players"></div>
</div>
<div class="card">
<h3>Captain & Vice-Captain</h3>
<label>Captain: <select id="captain"></select></label>
<br>
<label>Vice-Captain: <select id="vice"></select></label>
<p class="small">Captain earns 2x points and vice-captain 1.5x in this demo.</p>
<button onclick="saveTeam()">Save My Team</button>
<p id="result"></p>
</div>
</main>
<script>
const squad=[
["Aiden Markram","SA","BAT"],
["Travis Head","AUS","BAT"],
["Steven Smith","AUS","BAT"],
["Temba Bavuma","SA","BAT"],
["Cameron Green","AUS","AR"],
["Marco Jansen","SA","AR"],
["Pat Cummins","AUS","BOWL"],
["Kagiso Rabada","SA","BOWL"],
["Adam Zampa","AUS","BOWL"],
["Heinrich Klaasen","SA","WK"],
["Josh Inglis","AUS","WK"],
["Mitchell Starc","AUS","BOWL"],
["David Miller","SA","BAT"],
["Marnus Labuschagne","AUS","BAT"],
["Keshav Maharaj","SA","BOWL"]
];
const selected=new Set();
const players=document.getElementById("players");
squad.forEach((p,i)=>{
const div=document.createElement("div");
div.className="player";
div.innerHTML=`<span>${p[0]} <span class="small">${p[1]} · ${p[2]}</span></span><button type="button">${"Select"}</button>`;
div.querySelector("button").onclick=()=>{
if(selected.has(i))selected.delete(i);
else if(selected.size<11)selected.add(i);
else alert("Maximum 11 players!");
render();
};
players.appendChild(div);
});
function render(){
[...players.children].forEach((el,i)=>{
el.querySelector("button").textContent=selected.has(i)?"Remove":"Select";
});
document.getElementById("count").textContent=selected.size;
["captain","vice"].forEach(id=>{
const s=document.getElementById(id),old=s.value;
s.innerHTML='<option value="">Choose player</option>';
[...selected].forEach(i=>{
s.add(new Option(squad[i][0],i));
});
if([...s.options].some(o=>o.value===old))s.value=old;
});
}
function saveTeam(){
const c=document.getElementById("captain").value;
const v=document.getElementById("vice").value;
if(selected.size!==11){alert("Please select exactly 11 players.");return;}
if(c===""||v===""||c===v){alert("Choose different captain and vice-captain.");return;}
document.getElementById("result").textContent=
"Team saved for this session! Captain: "+squad[c][0]+", Vice-captain: "+squad[v][0]+".";
}
render();
</script>
</body>
</html>
